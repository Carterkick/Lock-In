<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lock In</title>
<meta name="description" content="Daily habits, food, and points tracker.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#500000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock In">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#500000; --maroon-2:#7A2020; --stone:#ECEDE8; --white:#fff;
  --ink:#2B2323; --muted:#6E6767; --line:#D8D8D0;
  --gold:#B8892E; --gold-ink:#7A5A17; --gold-soft:#F3E8CF;
  --red:#C62828; --red-soft:#FBE4E1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--stone); color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
.d{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;letter-spacing:.005em}
button{font-family:inherit;font-size:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-bottom:120px}

header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 12px}
.brand{font-size:30px;font-weight:900;color:var(--maroon);line-height:1}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;font-weight:600;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--white);border:1px solid var(--line)}
.chip.gold{background:var(--gold-soft);border-color:#E2CFA3;color:var(--gold-ink)}

.hero{background:var(--maroon);color:#fff;padding:18px 18px 20px}
.hero .greet{font-weight:600;font-size:15px;opacity:.9}
.hero .lab{margin-top:18px;font-size:14px;opacity:.7}
.hero h1{font-size:58px;font-weight:900;line-height:.9;margin:4px 0 14px;overflow-wrap:anywhere}
.track{height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:#fff;border-radius:3px}
.hero .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:7px;opacity:.85}
.hero .next{margin-top:14px;font-size:14px;font-weight:600;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--white);border-bottom:1px solid var(--line)}
.stats.three{grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stat{padding:12px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:29px;font-weight:800;line-height:1}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.weekbar{padding:12px 18px 0;font-size:13px;color:var(--muted)}
.weekbar span{display:block;margin-top:5px}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pcell{position:relative;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white);aspect-ratio:3/4;cursor:pointer}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pcap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11px;font-weight:600;padding:12px 4px 4px;text-align:center}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare figure{margin:0}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.compare figcaption{margin-top:4px;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(20,16,16,.94);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.overlay img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:10px}
.obar{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;flex-wrap:wrap;justify-content:center}
.lift{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px}
.lift.rest{background:transparent;border-style:dashed}
.liftname{font-size:38px;font-weight:900;line-height:1;color:var(--maroon);margin:2px 0 3px}
.lift.rest .liftname{color:var(--muted)}
.liftcycle{display:flex;gap:5px;margin-top:12px}
.liftcycle span{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:6px;background:#F3F3EF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liftcycle span.on{background:var(--maroon);color:#fff}
.nag{margin:16px 18px 0;padding:12px 14px;border-radius:12px;background:var(--red-soft);color:#6B1B1B;font-size:14px;border-left:4px solid var(--red)}
.nag b{display:block;font-size:21px;font-weight:800;color:var(--red);line-height:1.05;margin-bottom:3px}
.banner{margin:0 18px 10px;padding:10px 12px;border-radius:10px;font-size:13px}
.banner.warn{background:var(--red-soft);color:#7F1D1D}
.banner.info{background:var(--gold-soft);color:#4A3712}

section{padding:24px 18px 0}
h2.h{font-size:26px;font-weight:800;line-height:1;margin:0 0 4px}
.note{font-size:13px;color:var(--muted);margin:0 0 10px}
.note.tight{margin:2px 0 0}
.empty{font-size:14px;color:var(--muted);margin:4px 0 0}
.strong{font-weight:600}

.list{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
button.row{cursor:pointer}
.row .main{flex:1;min-width:0}
.row .title{display:block;font-weight:600}
.row .title.done{text-decoration:line-through;opacity:.5}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--maroon);background:transparent;display:grid;place-items:center;flex-shrink:0;padding:0;cursor:pointer;transition:background-color .15s}
.check.on{background:var(--maroon)}
.check svg{stroke:#fff;display:none}
.check.on svg{display:block}
.pts{font-weight:800;font-size:19px;color:var(--gold)}
.tag{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.tag.over{background:var(--red-soft);color:var(--red)}
.tag.soon{background:var(--gold-soft);color:var(--gold-ink)}
.tag.plain{padding:0;color:var(--muted);font-weight:500}

.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--maroon);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--red)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.iconbtn{background:none;border:0;padding:6px;color:var(--muted);cursor:pointer;border-radius:8px;display:inline-grid;place-items:center;flex-shrink:0}
.round{border:1px solid var(--line);border-radius:50%;width:38px;height:38px;background:var(--white);color:var(--ink)}

input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--white);font:inherit;color:inherit;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--maroon);border-color:transparent}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f input,label.f select{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.grid4 input{padding:8px}

.bar{height:8px;background:#E4E4DD;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.macro{margin-bottom:12px}
.macro .toprow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.macro b{font-size:24px;font-weight:800}

.timeline{position:relative;padding-left:20px;margin-top:10px}
.timeline:before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.wp{position:relative;padding:5px 0 11px}
.wp:before{content:'';position:absolute;left:-20px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--stone);border:2px solid #A8A29E}
.wp.past{opacity:.45}
.wp.now:before{background:var(--maroon);border-color:var(--maroon)}
.wp.now .strong{color:var(--maroon)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;cursor:pointer;position:relative;padding:0}
.day.today{border:2px solid var(--gold)}
.day.sel{box-shadow:0 0 0 2px var(--ink)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold);position:absolute;bottom:4px;left:50%;margin-left:-3px}

.dp{display:flex;gap:4px;flex-wrap:wrap}
.dp button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--white);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;padding:0}
.dp button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.edit{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.editrow{display:flex;gap:8px;align-items:center}
.corerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.corerow label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.corerow input{width:18px;height:18px;accent-color:#500000}

.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.quick button{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.quick button .kcal{color:var(--muted);font-weight:500;font-size:13px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:480px}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;min-width:0}
.tab.on{color:var(--maroon)}
.tab svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;white-space:nowrap;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.check{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="d brand">Lock In</span>
    <div class="chips">
      <span class="chip" id="lvlChip">Level 1</span>
      <span class="chip gold" id="ptsChip">0 pts</span>
    </div>
  </header>
  <div id="banners"></div>
  <main id="view"></main>
</div>

<nav class="tabs">
  <div class="in" id="tabs"></div>
</nav>

<script>
"use strict";
/* ---------------------------------------------------------------- */
/* Storage                                                           */
/* ---------------------------------------------------------------- */
const KEY = "lockin-v1";
const DAYL = ["S","M","T","W","T","F","S"];
const FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const ALL = [0,1,2,3,4,5,6], WEEK = [1,2,3,4,5];
const FOOD_PTS = { perMeal:10, maxMeals:4, protein:40, water:20 };
const TASK_PTS = 15;
const TITLES = ["Rookie","Warming up","Building","Consistent","Locked in","Disciplined","Machine","Elite","Legend"];

const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const hhmm = d => pad(d.getHours())+":"+pad(d.getMinutes());
const toMin = t => { if(typeof t!=="string"||!t.includes(":")) return null; const [h,m]=t.split(":").map(Number); return (isNaN(h)||isNaN(m))?null:h*60+m; };
const fmt = t => { const m = toMin(t); if(m==null) return ""; const h = Math.floor(m/60); return (h%12===0?12:h%12)+":"+pad(m%60)+" "+(h>=12?"PM":"AM"); };
const left = m => m>=60 ? Math.floor(m/60)+"h "+(m%60)+"m" : m+"m";
const n = v => Number(v)||0;
const dg = v => String(v).replace(/[^0-9]/g,"");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const blank = () => ({done:{},meals:[],water:0,tasks:[],notified:{}});

function defaults(){
  return {
    version:2,
    split:{0:"Push",1:"Pull",2:"Legs",3:"Upper",4:"Lower"},
    splitDetail:{
      Push:"Chest, shoulders, triceps",
      Pull:"Back, biceps, rear delts",
      Legs:"Quads, hamstrings, glutes, calves",
      Upper:"Chest, back, shoulders, arms",
      Lower:"Quads, hamstrings, glutes, calves"
    },
    habits:[
      {id:"gym",name:"Gym",points:75,core:true,due:"12:00",days:[0,1,2,3,4]},
      {id:"bible",name:"Bible chapter",points:50,core:true,due:"23:00",days:[...ALL],flexDays:[5,6]},
      {id:"prayer",name:"Prayer before bed",points:40,core:true,due:"23:30",days:[...ALL],flexDays:[5,6]},
      {id:"study",name:"Study block",points:60,core:true,due:"22:00",days:[0,1,2,3,4]},
      {id:"brazos",name:"Brazos Aerials clock in",points:50,core:false,due:"18:00",days:[1,3,5]},
      {id:"church",name:"Church",points:50,core:false,due:"16:30",days:[0]},
      {id:"plan",name:"Plan tomorrow",points:20,core:false,due:"23:45",days:[...ALL]}
    ],
    routine:[
      // Sunday
      {id:uid(),start:"09:00",end:"10:15",label:"Gym",days:[0]},
      {id:uid(),start:"16:30",end:"18:00",label:"Church",days:[0]},
      {id:uid(),start:"19:00",end:"21:00",label:"Study, reset for the week",days:[0]},
      // Monday
      {id:uid(),start:"08:30",end:"09:45",label:"Gym",days:[1]},
      {id:uid(),start:"13:15",end:"14:30",label:"MGMT-363, Welch",days:[1,3]},
      {id:uid(),start:"15:00",end:"17:00",label:"Brazos Aerials, clock in",days:[1]},
      {id:uid(),start:"18:00",end:"19:00",label:"FINC-341, Guyton",days:[1,3]},
      {id:uid(),start:"19:15",end:"20:45",label:"Study block",days:[1,3]},
      // Tuesday and Thursday
      {id:uid(),start:"08:30",end:"09:45",label:"MGMT-311, Dold",days:[2,4]},
      {id:uid(),start:"10:00",end:"11:15",label:"Gym",days:[2,4]},
      {id:uid(),start:"13:15",end:"14:30",label:"SCMT-364, Abbey",days:[2,4]},
      {id:uid(),start:"15:00",end:"17:00",label:"Study block",days:[2,4]},
      // Wednesday
      {id:uid(),start:"08:30",end:"09:45",label:"Gym",days:[3]},
      {id:uid(),start:"10:00",end:"12:00",label:"Brazos Aerials, clock in",days:[3]},
      {id:uid(),start:"16:00",end:"17:15",label:"FINC-210, Peterson",days:[3]},
      // Friday
      {id:uid(),start:"10:00",end:"12:00",label:"Brazos Aerials, clock in",days:[5]},
      // Sunday through Thursday nights
      {id:uid(),start:"22:30",end:"22:50",label:"Bible chapter",days:[0,1,2,3,4]},
      {id:uid(),start:"23:00",end:"23:15",label:"Prayer before bed",days:[0,1,2,3,4]}
    ],
    foods:[
      {id:uid(),name:"Herb parmesan salmon",calories:520,protein:46,carbs:8,fat:32,uses:0},
      {id:uid(),name:"Chicken fajitas, 3 tortillas",calories:640,protein:48,carbs:58,fat:20,uses:0},
      {id:uid(),name:"Ribeye steak, 8 oz",calories:610,protein:52,carbs:0,fat:44,uses:0},
      {id:uid(),name:"Pork chop and rice",calories:580,protein:44,carbs:52,fat:18,uses:0},
      {id:uid(),name:"Ceviche bowl",calories:340,protein:34,carbs:26,fat:10,uses:0},
      {id:uid(),name:"4 eggs and toast",calories:430,protein:28,carbs:30,fat:22,uses:0},
      {id:uid(),name:"Protein shake",calories:180,protein:30,carbs:6,fat:3,uses:0},
      {id:uid(),name:"Hamburger Helper, big bowl",calories:620,protein:32,carbs:64,fat:26,uses:0}
    ],
    targets:{calories:2500,protein:150,water:8},
    weeklyGoal:1800,
    notify:true,
    rewards:[
      {id:uid(),name:"Guilt-free lazy night",cost:400},
      {id:uid(),name:"Dinner out",cost:900},
      {id:uid(),name:"Round of golf",cost:1500},
      {id:uid(),name:"Day on the lake",cost:2500},
      {id:uid(),name:"New drone gear",cost:4000}
    ],
    redemptions:[],
    days:{}
  };
}

function migrate(s){
  const d = defaults();
  const arr = (v,f) => Array.isArray(v)?v:f;
  return Object.assign({}, d, s, {
    habits:arr(s.habits,d.habits), routine:arr(s.routine,d.routine),
    rewards:arr(s.rewards,d.rewards), redemptions:arr(s.redemptions,[]),
    foods:arr(s.foods,d.foods),
    split:Object.assign({},d.split,s.split||{}),
    splitDetail:Object.assign({},d.splitDetail,s.splitDetail||{}),
    targets:Object.assign({},d.targets,s.targets||{}),
    days:(s.days&&typeof s.days==="object")?s.days:{}
  });
}

let S, saveErr = false;
try { const raw = localStorage.getItem(KEY); S = raw ? migrate(JSON.parse(raw)) : defaults(); }
catch(e){ S = defaults(); }

let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); saveErr = false; }
    catch(e){ saveErr = true; renderBanners(); }
  }, 250);
}
function commit(){ save(); render(); }

/* ---------------------------------------------------------------- */
/* Scoring                                                           */
/* ---------------------------------------------------------------- */
function mealTotals(meals){
  return (meals||[]).reduce((a,m)=>({
    calories:a.calories+n(m.calories), protein:a.protein+n(m.protein),
    carbs:a.carbs+n(m.carbs), fat:a.fat+n(m.fat)
  }),{calories:0,protein:0,carbs:0,fat:0});
}
function dayPoints(day){
  if(!day) return 0;
  let p = 0;
  Object.values(day.done||{}).forEach(v => { p += n(v); });
  const meals = day.meals||[];
  p += Math.min(meals.length, FOOD_PTS.maxMeals) * FOOD_PTS.perMeal;
  const tp = n(S.targets.protein), tw = n(S.targets.water);
  if(tp>0 && mealTotals(meals).protein>=tp) p += FOOD_PTS.protein;
  if(tw>0 && n(day.water)>=tw) p += FOOD_PTS.water;
  (day.tasks||[]).forEach(t => { if(t.done) p += TASK_PTS; });
  return p;
}
function coreStatus(day, wd){
  const core = S.habits.filter(h => h.core && (h.days||[]).includes(wd));
  if(!core.length) return null;
  return core.every(h => day && day.done && day.done[h.id]!=null);
}
function pctDone(d){
  const day = S.days[dkey(d)];
  if(!day) return 0;
  const sched = S.habits.filter(h => (h.days||[]).includes(d.getDay()));
  if(!sched.length) return 0;
  return sched.filter(h => day.done && day.done[h.id]!=null).length / sched.length;
}
function streakNow(now){
  const d = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let st = 0;
  if(coreStatus(S.days[dkey(d)], d.getDay())===true) st++;
  for(let i=0;i<730;i++){
    d.setDate(d.getDate()-1);
    const c = coreStatus(S.days[dkey(d)], d.getDay());
    if(c===false) break;
    if(c===true) st++;
  }
  return st;
}
function streakBest(now){
  const keys = Object.keys(S.days).sort();
  if(!keys.length) return 0;
  const d = parseKey(keys[0]), endK = dkey(now);
  let run=0, best=0;
  for(let i=0;i<3000;i++){
    const k = dkey(d);
    if(k>endK) break;
    const c = coreStatus(S.days[k], d.getDay());
    if(c===true){ run++; if(run>best) best=run; }
    else if(c===false && k!==endK) run=0;
    d.setDate(d.getDate()+1);
  }
  return best;
}
function weekKeys(now){
  const st = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  st.setDate(st.getDate() - ((st.getDay()+6)%7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(st); d.setDate(st.getDate()+i); return dkey(d); });
}
function levelInfo(earned){
  let l=1;
  while(250*(l+1)*l <= earned) l++;
  const cur = 250*l*(l-1), next = 250*(l+1)*l;
  return {level:l, next, pct:Math.min(1,Math.max(0,(earned-cur)/(next-cur)))};
}

/* Progress photos live in IndexedDB, not localStorage: images are far too
   big for the 5MB localStorage budget. */
let DB = null, PHOTOS = [], photoErr = null;
function idb(){
  return new Promise((res,rej)=>{
    if(DB) return res(DB);
    if(!("indexedDB" in window)) return rej(new Error("no indexeddb"));
    const r = indexedDB.open("lockin-photos",1);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains("photos")) db.createObjectStore("photos",{keyPath:"id"});
    };
    r.onsuccess = e => { DB = e.target.result; res(DB); };
    r.onerror = () => rej(r.error || new Error("open failed"));
  });
}
function photoPut(rec){
  return idb().then(db => new Promise((res,rej)=>{
    const t = db.transaction("photos","readwrite");
    t.objectStore("photos").put(rec);
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error("out of space"));
  }));
}
function photoDel(id){
  return idb().then(db => new Promise((res,rej)=>{
    const t = db.transaction("photos","readwrite");
    t.objectStore("photos").delete(id);
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
  }));
}
function photoLoad(){
  return idb().then(db => new Promise((res,rej)=>{
    const t = db.transaction("photos","readonly");
    const rq = t.objectStore("photos").getAll();
    rq.onsuccess = () => res((rq.result||[]).sort((a,b)=>a.ts-b.ts));
    rq.onerror = () => rej(rq.error);
  }));
}
// Shrink to 1080px and re-encode, so a 4MB phone photo lands near 150KB.
function shrink(file, max, q){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, max/Math.max(w,h));
      w = Math.max(1,Math.round(w*sc)); h = Math.max(1,Math.round(h*sc));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try { res(c.toDataURL("image/jpeg",q)); } catch(e){ rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("not an image")); };
    img.src = url;
  });
}

function gcalUrl(text, start, end, details){
  const f = d => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  let u = "https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(text)+
    "&dates="+f(start)+"/"+f(end);
  if(details) u += "&details="+encodeURIComponent(details);
  return u;
}

    html += '<p class="note" style="margin-top:10px">These are stored on this phone only, and they are not in the backup file. Keep the originals in your camera roll.</p>';
  }
  html += '</section>';

  if(viewPhoto){
    const ph = PHOTOS.find(x=>x.id===viewPhoto);
    if(ph) html += '<div class="overlay" data-act="closephoto">'+
      '<img src="'+ph.src+'" alt="Progress photo from '+esc(ph.label)+'">'+
      '<div class="obar"><span>'+esc(ph.label)+'</span>'+
      '<button class="btn sm danger" data-act="delphoto" data-id="'+ph.id+'">Delete</button>'+
      '<button class="btn sm ghost" data-act="closephoto">Close</button></div></div>';
  }
  return html;
}

function viewHistory(){
  if(!calMonth) calMonth = new Date(NOW.getFullYear(),NOW.getMonth(),1);
  if(!selDay) selDay = todayKey();
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const dim = new Date(y,mo+1,0).getDate(), lead = new Date(y,mo,1).getDay();
  const tk = todayKey(), wk = weekKeys(NOW), wkp = wk.map(k=>dayPoints(S.days[k]));
  const goal = n(S.weeklyGoal), wkPts = wkp.reduce((a,b)=>a+b,0);
  const scale = Math.max(Math.round(goal/7), ...wkp, 1);
  const st = streakNow(NOW);

  let html = '<div class="stats three">'+
    '<div class="stat"><b class="d">'+st+'</b><span>Current streak</span></div>'+
    '<div class="stat"><b class="d">'+Math.max(streakBest(NOW),st)+'</b><span>Best streak</span></div>'+
    '<div class="stat"><b class="d">'+wkPts.toLocaleString()+'</b><span>Points this week</span></div></div>';

  html += '<section><h2 class="d h">This week</h2><p class="note">'+wkPts.toLocaleString()+' of '+goal.toLocaleString()+' points. A rough day just means a smaller bar.</p>'+
    '<div class="panel" style="padding-bottom:10px"><div style="display:flex;align-items:flex-end;gap:8px;height:120px">'+
    wk.map((k,i)=>'<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px">'+
      '<span class="note" style="margin:0;font-size:11px">'+(wkp[i]>0?wkp[i]:"")+'</span>'+
      '<div style="width:100%;height:'+((wkp[i]/scale)*78)+'%;min-height:'+(wkp[i]>0?4:0)+'px;background:'+(k===tk?"var(--maroon)":"var(--maroon-2)")+';opacity:'+(k>tk?.3:1)+';border-radius:6px 6px 2px 2px"></div></div>').join("")+
    '</div><div style="display:flex;gap:8px;margin-top:6px">'+
    ["M","T","W","T","F","S","S"].map((l,i)=>'<span class="note" style="margin:0;flex:1;text-align:center;font-size:12px;font-weight:'+(wk[i]===tk?700:500)+'">'+l+'</span>').join("")+
    '</div></div></section>';

  html += '<section><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
    '<h2 class="d h" style="margin:0">'+calMonth.toLocaleDateString("en-US",{month:"long",year:"numeric"})+'</h2>'+
    '<div style="display:flex;gap:6px">'+
    '<button class="iconbtn round" data-act="mon" data-v="-1" aria-label="Previous month">'+svg(ICON.left)+'</button>'+
    '<button class="iconbtn round" data-act="mon" data-v="1" aria-label="Next month">'+svg(ICON.right)+'</button></div></div>'+
    '<div class="cal" style="margin-bottom:5px">'+DAYL.map(l=>'<span class="note" style="margin:0;text-align:center;font-size:12px">'+l+'</span>').join("")+'</div><div class="cal">';
  for(let i=0;i<lead;i++) html += '<span></span>';
  for(let dd=1;dd<=dim;dd++){
    const d = new Date(y,mo,dd), k = dkey(d), p = pctDone(d);
    const allCore = coreStatus(S.days[k], d.getDay())===true;
    html += '<button class="day '+(k===tk?"today":"")+' '+(k===selDay?"sel":"")+'" data-act="selday" data-k="'+k+'" '+
      'style="background:'+(p>0?"rgba(80,0,0,"+(0.14+0.86*p)+")":"var(--white)")+';color:'+(p>0.5?"#fff":"var(--ink)")+';opacity:'+(k>tk?.4:1)+'" '+
      'aria-label="'+d.toDateString()+', '+Math.round(p*100)+' percent of habits done">'+dd+(allCore?'<span class="dot"></span>':"")+'</button>';
  }
  html += '</div><p class="note" style="margin-top:10px">Darker days mean more habits done. A gold dot means every core habit got done.</p></section>';

  const sd = S.days[selDay], sdate = parseKey(selDay);
  html += '<section><h2 class="d h">'+sdate.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})+'</h2>';
  if(!sd) html += '<p class="empty">Nothing logged this day.</p>';
  else {
    const st2 = mealTotals(sd.meals);
    const names = Object.keys(sd.done||{}).map(id=>{ const h=S.habits.find(x=>x.id===id); return h?(h.name||"Untitled habit"):"Removed habit"; });
    const tdone = (sd.tasks||[]).filter(x=>x.done).length;
    html += '<div class="panel" style="margin-top:8px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">'+
      [["Points",dayPoints(sd).toLocaleString()],["Meals",(sd.meals||[]).length],["Protein",st2.protein+"g"],["Water",n(sd.water)]]
        .map(p=>'<div><b class="d" style="display:block;font-size:24px;line-height:1">'+p[1]+'</b><span class="note" style="margin:0">'+p[0]+'</span></div>').join("")+
      '</div><div style="margin-top:12px"><div class="note" style="margin:0">Habits done</div><div>'+
      (names.length?esc(names.join(", ")):"None checked off")+'</div></div>'+
      (tdone?'<div style="margin-top:8px"><div class="note" style="margin:0">To-dos done</div><div>'+tdone+'</div></div>':"")+
      '</div>';
  }
  html += '</section>';
  return html;
}

function viewRewards(){
  const earned = Object.values(S.days).reduce((s,d)=>s+dayPoints(d),0);
  const spent = S.redemptions.reduce((s,r)=>s+n(r.cost),0);
  const bal = Math.max(0,earned-spent), lv = levelInfo(earned);
  const rewards = S.rewards.slice().sort((a,b)=>n(a.cost)-n(b.cost));
  let html = '<section style="padding-top:8px"><div class="note" style="margin:0">Points to spend</div>'+
    '<div class="d" style="font-size:74px;font-weight:900;color:var(--gold);line-height:.95">'+bal.toLocaleString()+'</div>'+
    '<div class="strong" style="margin-top:14px">Level '+lv.level+': '+TITLES[Math.min(lv.level-1,TITLES.length-1)]+'</div>'+
    '<div class="bar" style="margin-top:6px"><i style="width:'+(lv.pct*100)+'%;background:var(--maroon)"></i></div>'+
    '<p class="note" style="margin-top:6px">'+(lv.next-earned).toLocaleString()+' points to level '+(lv.level+1)+'. Spending points never lowers your level.</p></section>';

  html += '<section><h2 class="d h">Rewards</h2><p class="note">Set rewards you actually want. Redeem one when you have earned it.</p><div class="list">';
  if(!rewards.length) html += '<div class="row"><span class="note" style="margin:0">No rewards yet. Add something worth working for below.</span></div>';
  rewards.forEach(r=>{
    const c = n(r.cost), can = bal>=c;
    html += '<div class="row"><span class="main"><span class="title">'+esc(r.name)+'</span>'+
      '<span class="note" style="margin:0">'+(can ? c.toLocaleString()+" pts" : c.toLocaleString()+" pts, "+(c-bal).toLocaleString()+" to go")+'</span></span>'+
      '<button class="btn sm" data-act="redeem" data-id="'+r.id+'" '+(can?"":"disabled")+'>Redeem</button>'+
      '<button class="iconbtn" data-act="delreward" data-id="'+r.id+'" aria-label="Delete '+esc(r.name)+'">'+svg(ICON.trash,17)+'</button></div>';
  });
  html += '</div><div style="display:flex;gap:8px;margin-top:10px">'+
    '<input id="rName" placeholder="New reward" aria-label="Reward name" style="flex:2">'+
    '<input id="rCost" placeholder="Points" inputmode="numeric" aria-label="Reward cost" style="flex:1">'+
    '<button class="btn" data-act="addreward" aria-label="Add reward">'+svg(ICON.plus)+'</button></div></section>';

  if(S.redemptions.length){
    html += '<section><h2 class="d h">Redeemed</h2><div class="list" style="margin-top:8px">'+
      S.redemptions.slice(0,10).map(r=>'<div class="row"><span class="main">'+esc(r.name)+'</span>'+
      '<span class="note" style="margin:0">'+new Date(r.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})+'</span>'+
      '<span class="d pts" style="color:var(--muted)">-'+n(r.cost).toLocaleString()+'</span></div>').join("")+'</div></section>';
  }
  return html;
}

  html += '<button class="btn ghost" data-act="addhabit">'+svg(ICON.plus,16)+' Add habit</button></section>';

  html += '<section><div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'+

  S.routine.forEach(b=>{

  html += '<button class="btn ghost" data-act="addblock">'+svg(ICON.plus,16)+' Add time block</button></section>';

  html += '<section><h2 class="d h">Targets</h2><div class="grid2">'+
    '<label class="f">Calories per day<input inputmode="numeric" value="'+n(S.targets.calories)+'" data-act="tcal"></label>'+
    '<label class="f">Protein per day (g)<input inputmode="numeric" value="'+n(S.targets.protein)+'" data-act="tpro"></label>'+
    '<label class="f">Glasses of water<input inputmode="numeric" value="'+n(S.targets.water)+'" data-act="twat"></label>'+

/* ---------------------------------------------------------------- */
/* Render                                                            */
/* ---------------------------------------------------------------- */
const TABS = [["today","Today",ICON.sun],["food","Food",ICON.food],["gym","Gym",ICON.dumbbell],["history","History",ICON.cal],["rewards","Rewards",ICON.gift],["settings","Settings",ICON.gear]];

function renderBanners(){
  const el = document.getElementById("banners");
  let h = "";
  if(saveErr) h += '<div class="banner warn">Your phone is not saving data right now. Check that private browsing is off.</div>';
  el.innerHTML = h;
}

function render(){
  NOW = new Date();
  const earned = Object.values(S.days).reduce((s,d)=>s+dayPoints(d),0);
  const spent = S.redemptions.reduce((s,r)=>s+n(r.cost),0);
  document.getElementById("lvlChip").textContent = "Level "+levelInfo(earned).level;
  document.getElementById("ptsChip").textContent = Math.max(0,earned-spent).toLocaleString()+" pts";
  renderBanners();
  const v = document.getElementById("view");
  v.innerHTML = tab==="today" ? viewToday() : tab==="food" ? viewFood() : tab==="gym" ? viewGym()
    : tab==="history" ? viewHistory() : tab==="rewards" ? viewRewards() : viewSettings();
  document.getElementById("tabs").innerHTML = TABS.map(t=>
    '<button class="tab '+(tab===t[0]?"on":"")+'" data-tab="'+t[0]+'" '+(tab===t[0]?'aria-current="page"':"")+'>'+svg(t[2],22)+t[1]+'</button>').join("");
}

/* ---------------------------------------------------------------- */
/* Actions                                                           */
/* ---------------------------------------------------------------- */
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if(!b) return;
  tab = b.dataset.tab;
  if(tab!=="history"){ selDay=null; calMonth=null; }
  if(tab!=="gym") viewPhoto = null;
  window.scrollTo(0,0);
  render();
});

function val(id){ const el = document.getElementById(id); return el ? el.value : ""; }

document.getElementById("view").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b || b.tagName==="INPUT") return;
  const a = b.dataset.act, id = b.dataset.id;

  if(a==="habit"){
    const h = S.habits.find(x=>x.id===id); if(!h) return;
    const was = today().done && today().done[h.id]!=null;
    upday(d => { if(d.done[h.id]!=null) delete d.done[h.id]; else d.done[h.id] = n(h.points); });
    if(!was){
      const wd = NOW.getDay();
      const coreToday = S.habits.filter(x=>x.core&&(x.days||[]).includes(wd));
      const t = today();
      const finishes = h.core && coreToday.every(x => x.id===h.id || (t.done && t.done[x.id]!=null));
      buzz(finishes?[40,60,40]:20);
      toast(finishes ? "All core done, streak alive" : "+"+n(h.points)+" pts");
    }
    return commit();
  }
  if(a==="addtask"){
    const v = val("taskIn").trim(); if(!v) return;
    upday(d => d.tasks.push({id:uid(),text:v,done:false}));
    return commit();
  }
  if(a==="task"){
    const t = (today().tasks||[]).find(x=>x.id===id);
    upday(d => { d.tasks = d.tasks.map(x => x.id===id?Object.assign({},x,{done:!x.done}):x); });
    if(t && !t.done){ buzz(20); toast("+"+TASK_PTS+" pts"); }
    return commit();
  }
  if(a==="addphoto"){ photoErr = null; document.getElementById("photoIn").click(); return; }
  if(a==="openphoto"){ viewPhoto = id; return render(); }
  if(a==="closephoto"){ viewPhoto = null; return render(); }
  if(a==="delphoto"){
    photoDel(id).then(()=>{
      PHOTOS = PHOTOS.filter(x=>x.id!==id);
      viewPhoto = null; render(); toast("Photo deleted");
    }).catch(()=>toast("Could not delete that photo"));
    return;
  }
  if(a==="taskcal"){
    const t = (today().tasks||[]).find(x=>x.id===id); if(!t) return;
    const sl = nextSlot();
    window.open(gcalUrl(t.text, sl[0], sl[1], "Added from Lock In"), "_blank");
    return toast("Pick a time, then save");
  }
  if(a==="deltask"){ upday(d => { d.tasks = d.tasks.filter(x=>x.id!==id); }); return commit(); }

  if(a==="water"){
    const tw = n(S.targets.water), prev = n(today().water);
    const v = Math.max(0,Math.min(40, prev + Number(b.dataset.v)));
    upday(d => { d.water = v; });
    if(tw>0 && prev<tw && v>=tw){ buzz(30); toast("Water goal hit, +"+FOOD_PTS.water+" pts"); }
    return commit();
  }
  if(a==="quickfood"){
    const f = S.foods.find(x=>x.id===id); if(!f) return;
    f.uses = n(f.uses)+1;
    logMeal({name:f.name,calories:n(f.calories),protein:n(f.protein),carbs:n(f.carbs),fat:n(f.fat)});
    return commit();
  }
  if(a==="addfood"){
    const name = val("fName").trim(); if(!name) return toast("Give the meal a name");
    const m = {name, calories:n(dg(val("fCal"))), protein:n(dg(val("fPro"))), carbs:n(dg(val("fCarb"))), fat:n(dg(val("fFat")))};
    const same = S.foods.find(f => f.name.toLowerCase()===name.toLowerCase());
    if(same) Object.assign(same, m, {uses:n(same.uses)+1});
    else S.foods.push(Object.assign({id:uid(),uses:1}, m));
    logMeal(m);
    return commit();
  }
  if(a==="delmeal"){ upday(d => { d.meals = d.meals.filter(x=>x.id!==id); }); return commit(); }

  if(a==="mon"){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+Number(b.dataset.v), 1); return render(); }
  if(a==="selday"){ selDay = b.dataset.k; return render(); }

  if(a==="redeem"){
    const r = S.rewards.find(x=>x.id===id); if(!r) return;
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Tap to confirm"; b.style.background="var(--gold)"; return; }
    S.redemptions.unshift({id:uid(),name:r.name,cost:n(r.cost),date:new Date().toISOString()});
    buzz([40,60,40]); toast("Redeemed: "+r.name);
    return commit();
  }
  if(a==="addreward"){
    const nm = val("rName").trim(), c = parseInt(dg(val("rCost")),10);
    if(!nm || !c) return toast("Add a name and a point cost");
    S.rewards.push({id:uid(),name:nm,cost:c});
    return commit();
  }
  if(a==="delreward"){ S.rewards = S.rewards.filter(x=>x.id!==id); return commit(); }

  if(a==="addhabit"){ S.habits.push({id:uid(),name:"",points:25,core:false,due:"",days:[...ALL]}); return commit(); }
  if(a==="delhabit"){ S.habits = S.habits.filter(x=>x.id!==id); return commit(); }
  if(a==="hday"){
    const h = S.habits.find(x=>x.id===id); if(!h) return;
    const dd = Number(b.dataset.day);
    h.days = (h.days||[]).includes(dd) ? h.days.filter(x=>x!==dd) : (h.days||[]).concat(dd).sort();
    return commit();
  }
  if(a==="addblock"){ S.routine.push({id:uid(),start:"12:00",end:"13:00",label:"",days:[...ALL]}); return commit(); }
  if(a==="delblock"){ S.routine = S.routine.filter(x=>x.id!==id); return commit(); }
  if(a==="bday"){
    const bl = S.routine.find(x=>x.id===id); if(!bl) return;
    const dd = Number(b.dataset.day);
    bl.days = (bl.days||[]).includes(dd) ? bl.days.filter(x=>x!==dd) : (bl.days||[]).concat(dd).sort();
    return commit();
  }
  if(a==="sortblocks"){ S.routine.sort((x,y)=>(toMin(x.start)||0)-(toMin(y.start)||0)); return commit(); }

  if(a==="asknotify"){
    if(!("Notification" in window)) return toast("Not supported here");
    Notification.requestPermission().then(p => {
      S.notify = (p==="granted");
      save();
      render();
      toast(p==="granted" ? "Reminders on" : "Reminders not allowed");
    });
    return;
  }
  if(a==="togglenotify"){ S.notify = !S.notify; save(); render(); return toast(S.notify?"Reminders on":"Reminders off"); }

  if(a==="export"){
    const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = "lock-in-backup-"+todayKey()+".json";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    return toast("Backup saved");
  }
  if(a==="import"){ document.getElementById("fileIn").click(); return; }

  if(a==="reset"){
    if(!confirmReset){ confirmReset = true; return render(); }
    S = defaults(); confirmReset = false; commit(); return toast("All data erased");
  }
  if(a==="cancelreset"){ confirmReset = false; return render(); }
});

function logMeal(m){
  const before = mealTotals(today().meals).protein;
  const count = (today().meals||[]).length;
  const tp = n(S.targets.protein);
  upday(d => d.meals.push(Object.assign({id:uid(),time:hhmm(new Date())}, m)));
  const hit = tp>0 && before<tp && before+n(m.protein)>=tp;
  const gained = (count<FOOD_PTS.maxMeals?FOOD_PTS.perMeal:0) + (hit?FOOD_PTS.protein:0);
  buzz(20);
  toast(hit ? "Protein goal hit, +"+gained+" pts" : gained ? "Meal logged, +"+gained+" pts" : "Meal logged");
}

document.getElementById("view").addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if(!el || !("value" in el)) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.value;
  const h = () => S.habits.find(x=>x.id===id);
  const bl = () => S.routine.find(x=>x.id===id);
  const map = {
    hname:()=>{ h().name = v; },
    hpts:()=>{ h().points = parseInt(dg(v),10)||0; },
    hdue:()=>{ h().due = v; },
    hcore:()=>{ h().core = el.checked; },
    blabel:()=>{ bl().label = v; },
    bstart:()=>{ bl().start = v; },
    bend:()=>{ bl().end = v; },
    tcal:()=>{ S.targets.calories = parseInt(dg(v),10)||0; },
    tpro:()=>{ S.targets.protein = parseInt(dg(v),10)||0; },
    twat:()=>{ S.targets.water = parseInt(dg(v),10)||0; },
    tgoal:()=>{ S.weeklyGoal = parseInt(dg(v),10)||0; },
    split:()=>{ S.split[Number(el.dataset.day)] = v.trim(); }
  };
  if(!map[a]) return;
  try { map[a](); } catch(err){ return; }
  save();
  if(a==="hcore"||a==="hdue") render();
});

document.addEventListener("change", e => {
  if(e.target.id!=="photoIn" || !e.target.files || !e.target.files[0]) return;
  const file = e.target.files[0];
  e.target.value = "";
  if(!/^image\//.test(file.type)){ photoErr = "That file is not a photo."; return render(); }
  toast("Saving photo");
  shrink(file, 1080, 0.75).then(src => {
    const now = new Date();
    const rec = {
      id: uid(), ts: now.getTime(), src,
      label: now.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + (S.split[now.getDay()] ? " \u00b7 "+S.split[now.getDay()] : "")
    };
    return photoPut(rec).then(()=>{
      PHOTOS.push(rec);
      PHOTOS.sort((a,b)=>a.ts-b.ts);
      photoErr = null; render(); toast("Photo saved");
    });
  }).catch(err => {
    photoErr = (err && /space|quota/i.test(String(err.name||err.message)))
      ? "Your phone is out of room for photos. Delete a few old ones."
      : "Could not save that photo. Try another one.";
    render();
  });
}, true);

document.addEventListener("change", e => {
  if(e.target.id!=="fileIn" || !e.target.files || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const parsed = JSON.parse(fr.result);
      if(!parsed || typeof parsed!=="object" || !parsed.days) throw new Error("bad file");
      S = migrate(parsed);
      commit();
      toast("Backup restored");
    } catch(err){ toast("That file is not a Lock In backup"); }
  };
  fr.onerror = () => toast("Could not read that file");
  fr.readAsText(e.target.files[0]);
  e.target.value = "";
});

document.addEventListener("keydown", e => {
  if(e.key!=="Enter") return;
  if(e.target.id==="taskIn"){ e.preventDefault(); document.querySelector('[data-act="addtask"]').click(); }
  if(e.target.id==="rCost"||e.target.id==="rName"){ e.preventDefault(); document.querySelector('[data-act="addreward"]').click(); }
});

/* ---------------------------------------------------------------- */
/* Reminders (fire while the app is open or recently backgrounded)   */
/* ---------------------------------------------------------------- */
function fire(title, body){
  try {
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg => reg.showNotification(title,{body,icon:"icon-192.png",badge:"icon-192.png",tag:"lockin"}))
        .catch(()=>{ new Notification(title,{body,icon:"icon-192.png"}); });
    } else new Notification(title,{body,icon:"icon-192.png"});
  } catch(e){}
}
function checkReminders(){
  if(!S.notify || !("Notification" in window) || Notification.permission!=="granted") return;
  const now = new Date(), wd = now.getDay(), mins = now.getHours()*60+now.getMinutes();
  const t = today();
  let changed = false;
  S.habits.filter(h => (h.days||[]).includes(wd) && !isFlex(h,wd) && toMin(h.due)!=null).forEach(h => {
    const due = toMin(h.due);
    const done = t.done && t.done[h.id]!=null;
    const already = t.notified && t.notified["h"+h.id];
    if(!done && !already && mins>=due && mins-due<180){
      fire("Have you done "+((h.id==="gym"&&S.split[wd])?(h.name+" \u2014 "+S.split[wd]):(h.name||"this"))+" yet?", "It was due at "+fmt(h.due)+". Worth "+n(h.points)+" points.");
      upday(d => { d.notified["h"+h.id] = 1; });
      changed = true;
    }
  });
  S.routine.filter(b => (b.days||[]).includes(wd) && toMin(b.start)!=null).forEach(b => {
    const st = toMin(b.start);
    const already = t.notified && t.notified["b"+b.id];
    if(!already && mins>=st && mins-st<10){
      fire(blockLabel(b,wd), "Starts now, until "+fmt(b.end)+".");
      upday(d => { d.notified["b"+b.id] = 1; });
      changed = true;
    }
  });
  if(changed) save();
}

/* ---------------------------------------------------------------- */
/* Boot                                                              */
/* ---------------------------------------------------------------- */
render();
checkReminders();
idb().then(photoLoad).then(list => { PHOTOS = list; if(tab==="gym") render(); }).catch(()=>{});
setInterval(() => { const before = NOW.getMinutes(); NOW = new Date(); checkReminders(); if(NOW.getMinutes()!==before && (tab==="today")) render(); }, 30000);
document.addEventListener("visibilitychange", () => { if(!document.hidden){ NOW = new Date(); render(); checkReminders(); } });

if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
